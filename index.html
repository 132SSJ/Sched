<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매일 체크리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#fff4cc;--dot:#ffe39a;--card:#fffdf7;--tx:#4a3b32;--sub:#a08c7b;--ln:#f0e3c8;--bd:#3b2f2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2334;--dot:#352d42;--card:#3a3148;--tx:#fbeee0;--sub:#b9a9c4;--ln:#4b4060;--bd:#fbeee0}}
:root[data-theme="dark"]{--bg:#2a2334;--dot:#352d42;--card:#3a3148;--tx:#fbeee0;--sub:#b9a9c4;--ln:#4b4060;--bd:#fbeee0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg) radial-gradient(var(--dot) 2.5px,transparent 3px) 0 0/22px 22px}
main{max-width:560px;margin:0 auto;padding:22px 16px 44px}
header{text-align:center}
.mascot{position:relative;width:84px;height:72px;margin:0 auto 8px;animation:bob 2.2s ease-in-out infinite}
.mascot i{position:absolute;display:block}
.e{top:0;width:22px;height:22px;background:#fff;border:3.5px solid #3b2f2f;border-radius:50%}
.e.l{left:6px}.e.r{right:6px}
.h{inset:8px 0 0;background:#fff;border:3.5px solid #3b2f2f;border-radius:50% 50% 46% 46%}
.y{top:34px;width:9px;height:11px;background:#3b2f2f;border-radius:50%}
.y.l{left:24px}.y.r{right:24px}
.c{top:45px;width:15px;height:9px;background:#f9b9c6;border-radius:50%}
.c.l{left:9px}.c.r{right:9px}
.m{left:50%;top:46px;width:10px;height:6px;margin-left:-5px;border-bottom:3px solid #3b2f2f;border-radius:0 0 10px 10px}
.mascot.happy .y{height:6px;width:11px;background:none;border-top:3.5px solid #3b2f2f;border-radius:10px 10px 0 0;top:36px}
.mascot.happy::after{content:"♡";position:absolute;right:-16px;top:2px;color:#f27a95;font-size:22px;animation:pop .8s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{to{transform:scale(1.3) rotate(10deg)}}
h1{font-size:26px;margin:0;font-weight:400;letter-spacing:.5px}
.date{color:var(--sub);font-size:15px;margin:2px 0 14px}
.bar{height:22px;background:var(--card);border:3.5px solid var(--bd);border-radius:99px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(-45deg,#f9a8bd 0 10px,#fbc3d2 10px 20px);transition:width .35s cubic-bezier(.3,1.5,.5,1)}
.sum{display:flex;justify-content:space-between;font-size:15px;margin:8px 4px 4px}
.msg{text-align:center;font-size:17px;margin:2px 0 16px;min-height:26px}
.card{--c:#ffd45e;--d:#e7b52c;background:var(--card);border:3.5px solid var(--d);border-radius:24px;padding:12px 14px 6px;margin-bottom:16px;box-shadow:0 6px 0 var(--d);transition:transform .2s}
.card.done{background:color-mix(in srgb,var(--c) 22%,var(--card));animation:wig .5s}
@keyframes wig{25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
.tag{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tag b{background:var(--c);color:#4a3b32;font-weight:400;font-size:18px;padding:4px 14px;border-radius:99px;border:3px solid var(--d)}
.tag span{font-size:14px;color:var(--sub)}
.card.done .tag span{color:var(--tx)}
label{display:flex;gap:12px;align-items:center;padding:12px 2px;border-top:2.5px dashed var(--ln);font-size:17px;cursor:pointer;line-height:1.35}
label:first-of-type{border-top:0}
input{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:30px;margin:0;border:3px solid var(--d);border-radius:11px;background:#fff;display:grid;place-content:center;transition:background .15s,transform .15s}
input::after{content:"✓";font-size:20px;line-height:1;color:#4a3b32;transform:scale(0);transition:transform .25s cubic-bezier(.3,2,.5,1)}
input:checked{background:var(--c);transform:rotate(-6deg)}
input:checked::after{transform:scale(1)}
input:checked+span{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--d);text-decoration-thickness:2.5px}
button{display:block;margin:6px auto 0;padding:10px 22px;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;font:inherit;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.pic{width:220px;aspect-ratio:4/3;margin:0 auto 10px;border:3.5px solid var(--bd);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.15);cursor:pointer;display:none;animation:bob 2.2s ease-in-out infinite}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.row button{margin:6px 0}
</style>
</head>
<body>
<main>
<header>
<div class="mascot" id="mascot"><i class="e l"></i><i class="e r"></i><i class="h"></i><i class="y l"></i><i class="y r"></i><i class="c l"></i><i class="c r"></i><i class="m"></i></div>
<div class="pic" id="pic"><img id="picimg" alt=""></div>
<h1>매일 체크리스트</h1>
<div class="date" id="date"></div>
</header>
<div class="bar"><i id="bar"></i></div>
<div class="sum"><span id="cnt"></span><span id="pct"></span></div>
<div class="msg" id="msg"></div>
<div id="list"></div>
<div class="row">
<button id="reset">🧹 오늘 체크 초기화</button>
<button id="addimg">🖼️ 내 이미지 넣기</button>
<button id="delimg" style="display:none">🗑️ 이미지 빼기</button>
</div>
<input type="file" id="file" accept="image/*" multiple style="display:none">
</main>
<script>
const DATA=[
["국어","📖","#ffd45e","#e7b52c",["무제 1일차+강아트로 총 6지문","언매n제 1세트(또는 실모)"]],
["수학","📐","#7fcdf5","#4aa9dc",["n기출 20문제","설맞이 20문제","지인선 1세트(또는 실모)"]],
["영어","🔤","#f9a8bd","#e2748f",["빈순삽 기출 1개"]],
["물리","🔭","#f7a04a","#d97c1c",["실모 1개","특난도모의고사 1회분(또는 일당백 3단원)"]],
["지구","🌍","#f28b8e","#d6595d",["실모 1개","매직 실전문제 30문제"]]
];
const d=new Date(),pad=n=>String(n).padStart(2,"0");
const key="checklist:"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
document.getElementById("date").textContent=d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+"일월화수목금토"[d.getDay()]+"요일";
let st={};
try{st=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){st={}}
function save(){try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}pushDb()}
function render(){
  const list=document.getElementById("list");list.innerHTML="";
  let total=0,done=0;
  DATA.forEach(([sub,emo,c,dk,items],si)=>{
    const card=document.createElement("div");card.className="card";
    card.style.setProperty("--c",c);card.style.setProperty("--d",dk);
    let sd=0;
    items.forEach((t,ii)=>{if(st[si+"-"+ii])sd++});
    total+=items.length;done+=sd;
    const full=sd===items.length;
    if(full)card.classList.add("done");
    card.innerHTML='<div class="tag"><b>'+emo+" "+sub+"</b><span>"+(full?"완료 🎀":sd+" / "+items.length)+"</span></div>";
    items.forEach((t,ii)=>{
      const l=document.createElement("label"),k=document.createElement("input"),s=document.createElement("span");
      k.type="checkbox";k.checked=!!st[si+"-"+ii];s.textContent=t;
      k.onchange=()=>{st[si+"-"+ii]=k.checked;save();render()};
      l.append(k,s);card.append(l);
    });
    list.append(card);
  });
  const p=Math.round(done/total*100);
  document.getElementById("bar").style.width=Math.max(p,4)+"%";
  document.getElementById("cnt").textContent="✅ "+done+" / "+total;
  document.getElementById("pct").textContent=p+"%";
  document.getElementById("mascot").classList.toggle("happy",p===100);
  document.getElementById("msg").textContent=p===100?"오늘 다 했다! 정말 수고했어 🎉":p>=50?"거의 다 왔어! 조금만 더 💪":p>0?"좋아, 시작이 반이야 ✨":"오늘도 하나씩 해볼까? 🌷";
}
document.getElementById("reset").onclick=()=>{st={};save();render()};
let imgs=[],idx=0;
try{imgs=JSON.parse(localStorage.getItem("checklist:imgs")||"[]")}catch(e){imgs=[]}
const $=id=>document.getElementById(id);
function showImg(){
  const has=imgs.length>0;
  $("pic").style.display=has?"block":"none";
  $("mascot").style.display=has?"none":"";
  $("delimg").style.display=has?"":"none";
  if(has)$("picimg").src=imgs[idx%imgs.length];
}
function saveImgs(){let ok=false;try{localStorage.setItem("checklist:imgs",JSON.stringify(imgs));ok=true}catch(e){}
  if(db&&uid){db.doc(P("pics")).set({imgs}).catch(()=>{});ok=true}return ok}
const shrink=f=>new Promise(res=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const s=Math.min(1,340/im.width),c=document.createElement("canvas");
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.7))};
    im.onerror=()=>res(null);im.src=fr.result};
  fr.onerror=()=>res(null);fr.readAsDataURL(f);
});
$("addimg").onclick=()=>$("file").click();
$("file").onchange=async()=>{
  const files=[...$("file").files].slice(0,6-imgs.length);
  for(const f of files){const u=await shrink(f);if(u)imgs.push(u)}
  $("file").value="";
  while(imgs.length&&JSON.stringify(imgs).length>240000)imgs.pop();
  if(!saveImgs()){imgs.length=Math.max(0,imgs.length-files.length);$("msg").textContent="이미지가 너무 커서 저장이 안 됐어 😢"}
  idx=0;showImg();
};
$("pic").onclick=()=>{idx=(idx+1)%imgs.length;showImg()};
$("delimg").onclick=()=>{imgs=[];idx=0;saveImgs();showImg()};
showImg();
render();
let db=null,uid=null,tm=null;
const P=n=>"data/users/"+uid+"/"+n;
function pushDb(){if(!db||!uid)return;clearTimeout(tm);tm=setTimeout(()=>{db.doc(P("state")).set({date:key,checks:st}).catch(()=>{})},400)}
(async()=>{
  try{
    if(typeof claude==="undefined"||!claude.use)return;
    const [u,d]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!u||!d)return;
    const id=await u.id();if(!id)return;
    db=d;uid=id;
    const [s,p]=await Promise.all([db.doc(P("state")).get(),db.doc(P("pics")).get()]);
    if(s.exists){const v=s.data();if(v.date===key&&v.checks){st=v.checks;try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}}}
    else if(Object.keys(st).length)pushDb();
    if(p.exists&&Array.isArray(p.data().imgs)&&p.data().imgs.length){imgs=p.data().imgs;idx=0}
    else if(imgs.length)saveImgs();
    render();showImg();
  }catch(e){db=null}
})();
</script>
</body>
</html>
